# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Minimal azd project file. Run `azd ai agent init` against an existing
# Foundry project to scaffold/update the `services:` block below with the
# project connection (host: azure.ai.project) and this agent's hosted-agent
# definition (host: azure.ai.agent) -- see README.md section 9 for the full
# deploy flow (azd ai agent init, then azd deploy).
#
# To enable the "<container>-inbound" -> "<container>-outbound" blob
# workflow (see src/storage.py and README.md section 9), add under the
# hosted-agent service's `env:` block once `azd ai agent init` has
# scaffolded it:
#   STORAGE_BACKEND: azure_blob
#   AZURE_STORAGE_ACCOUNT_URL: https://<your-storage-account>.blob.core.windows.net/
#   OUTPUT_CONTAINER: outputs   # fallback only, used when a container name doesn't end in "-inbound"

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.8'
        azure.ai.projects: '>=1.0.0-beta.4'
name: fleet-data-enrichment-validation-agent
